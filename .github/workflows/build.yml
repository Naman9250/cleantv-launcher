name: Build CleanTV Launcher APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: /home/runner/.gradle/wrapper/dists/*/*/gradle-8.5/bin/gradle assembleDebug --stacktrace --no-daemon || gradle assembleDebug --stacktrace --no-daemon

      - name: Upload CleanTV Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanTV-Launcher-Debug
          path: app/build/outputs/apk/debug/*.apk
