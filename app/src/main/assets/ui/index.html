<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CleanTV Launcher</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: radial-gradient(circle at 50% 20%, #111827 0%, #030712 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 3rem;
  }
  .glass {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
  }
  /* Top Bar */
  .top-bar { display: flex; justify-content: space-between; font-size: 1.1rem; color: #9ca3af; }
  
  /* Hero 80/20 Layout */
  .hero-container {
    display: flex;
    gap: 1.5rem;
    height: 50vh;
  }
  .card-continue {
    flex: 8;
    padding: 2.5rem;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
  }
  .card-continue h2 { font-size: 2.5rem; margin-bottom: 0.5rem; }
  .card-continue p { color: #9ca3af; font-size: 1.1rem; }
  
  .card-music {
    flex: 2;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .vinyl {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle, #374151 30%, #111827 70%);
    border: 3px solid rgba(255,255,255,0.2);
    margin-bottom: 1rem;
    animation: spin 10s linear infinite;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  /* Dock */
  .dock {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    padding: 1rem 2rem;
    align-self: center;
  }
  .app-icon {
    width: 80px;
    height: 80px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    outline: none;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .app-icon:focus, .app-icon:hover {
    transform: scale(1.15);
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
    border: 2px solid #ffffff;
  }

  /* Standby Mode */
  #standby {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 99;
  }
  #standby-clock { font-size: 6rem; font-weight: 200; letter-spacing: 2px; }
  #standby-sub { color: #6b7280; font-size: 1.5rem; margin-top: 1rem; }
</style>
</head>
<body>

  <div class="top-bar">
    <div class="glass" style="padding: 0.5rem 1.5rem;">CleanTV • Apple Glass</div>
    <div class="glass" style="padding: 0.5rem 1.5rem;" id="clock">00:00</div>
  </div>

  <div class="hero-container">
    <div class="card-continue glass">
      <span style="color: #38bdf8; font-weight: bold; text-transform: uppercase;">Continue Watching</span>
      <h2>Interstellar</h2>
      <p>Resume from 01:24:10 • 4K HDR</p>
    </div>
    <div class="card-music glass">
      <div class="vinyl"></div>
      <h4>Now Playing</h4>
      <p style="color: #9ca3af; font-size: 0.9rem; margin-top: 0.3rem;">Starboy Ambient</p>
    </div>
  </div>

  <div class="dock glass">
    <div tabindex="1" class="app-icon" style="background: #ef4444;" onclick="launch('com.google.android.youtube.tv')">YT</div>
    <div tabindex="2" class="app-icon" style="background: #e50914;" onclick="launch('com.netflix.ninja')">NF</div>
    <div tabindex="3" class="app-icon" style="background: #1e3a8a;" onclick="launch('in.startv.hotstar')">HS</div>
    <div tabindex="4" class="app-icon" style="background: #10b981;" onclick="launch('com.spotify.tv.android')">SP</div>
    <div tabindex="5" class="app-icon" style="background: #0284c7;" onclick="launch('com.amazon.amazonvideo.livingroom')">PV</div>
  </div>

  <!-- Ambient Standby -->
  <div id="standby">
    <div id="standby-clock">12:00</div>
    <div id="standby-sub">Press any key to wake</div>
  </div>

<script>
  function updateTime() {
    const d = new Date();
    const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    document.getElementById('clock').innerText = timeStr;
    document.getElementById('standby-clock').innerText = timeStr;
  }
  setInterval(updateTime, 1000);
  updateTime();

  function launch(pkg) {
    if (window.AndroidBridge) {
      window.AndroidBridge.launchApp(pkg);
    } else {
      console.log("Launching: " + pkg);
    }
  }

  // Standby Timer (60 seconds idle)
  let idleTimer;
  function resetIdle() {
    document.getElementById('standby').style.display = 'none';
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      document.getElementById('standby').style.display = 'flex';
    }, 60000);
  }
  window.addEventListener('keydown', resetIdle);
  resetIdle();
</script>
</body>
</html>
